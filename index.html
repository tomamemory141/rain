<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雨の予報</title>
<style>
/* iPhone天気アプリ風:暗い空の上に 上=現在の気温 / 中=1時間の雨 / 下=1時間ごとの予報 */
:root {
  --sky1: #ffffff; --sky2: #ffffff;
  --card: #f3f6fa; --line: rgba(20,40,60,.14);
  --fg: #1b2733; --sub: #5d6b79; --bar: #3d9bff; --pop: #2b7fd0;
  --font: -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box }
html, body { margin: 0 }
body { background: #fff; color: var(--fg); font-family: var(--font); padding: 6px 12px; min-height: 100vh }
.wrap { max-width: 560px; display: grid; gap: 6px }

.now { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 0 4px }
.now .place { font-size: 15px; font-weight: 600 }
.now .temp { font-size: 30px; font-weight: 300; line-height: 1 }
.now .hl, .now .cond { font-size: 13px; color: var(--sub) }

.umb { font-size: 13px; font-weight: 700; color: var(--pop) }
.card { background: var(--card); border-radius: 16px; padding: 8px 14px 6px; backdrop-filter: blur(12px); min-width: 0 }
.title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 6px }
h1 { font-size: 16px; margin: 0; font-weight: 700 }
.msg { font-size: 13px; margin: 0 }
.msg.sum { font-weight: 700; color: var(--pop) }
.plot { position: relative; height: 84px; margin-right: 7.5em; border-bottom: 1px solid rgba(20,40,60,.3) }
.dots { position: absolute; left: 0; right: -7.5em; border-top: 1.5px dashed rgba(20,40,60,.22) }
.dots span { position: absolute; right: 0; top: -7px; font-size: 11px; line-height: 13px; color: #34434f; white-space: nowrap }
.dots span b { display: inline-block; width: 3.2em; text-align: right; margin-right: 4px; font-weight: 700 }
.bars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 2px }
.bars i { flex: 1; background: var(--bar); border-radius: 2px 2px 0 0; min-width: 1px }
.axis { position: relative; height: 15px; margin-top: 2px; margin-right: 7.5em; font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums }
.axis span { position: absolute; transform: translateX(-50%); white-space: nowrap }
.axis span:first-child { transform: none }

.cap { font-size: 12px; color: var(--sub); padding-bottom: 5px; border-bottom: 1px solid var(--line); margin-bottom: 5px }
.hours { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none }
.hours::-webkit-scrollbar { display: none }
.h { flex: 0 0 52px; display: grid; justify-items: center; gap: 2px; font-variant-numeric: tabular-nums }
.h .t { font-size: 13px; font-weight: 600 }
.h .ic { height: 28px }
.h .ic svg { display: block }
.h .p { font-size: 11px; color: var(--pop); font-weight: 700; min-height: 13px }
.h .v { font-size: 17px; white-space: nowrap }
.h .mm { font-size: 11px; color: var(--pop); font-weight: 700; min-height: 13px }

.days { display: grid; font-variant-numeric: tabular-nums }
.d { display: grid; grid-template-columns: 2.4em 28px 2.8em 7.6em 2.2em minmax(40px,1fr) 2.2em; align-items: center; gap: 7px; padding: 4px 0; border-top: 1px solid var(--line) }
.d:first-child { border-top: 0 }
.d.head { padding: 0 0 2px; font-size: 16px; color: var(--sub); border-top: 0 }
.d.head > div { font-size: 10px }
.d.head + .d { border-top: 0 }
.d .w { font-size: 15px; font-weight: 600 }
.d .ic svg { display: block }
.d .p { font-size: 11px; color: var(--pop); font-weight: 700 }
.d .mm { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--sub); align-self: stretch; margin: -4px 0 }
.d .mm .g { flex: 1; position: relative; align-self: stretch; margin: 4px 0; border-bottom: 1px solid rgba(20,40,60,.28) }
.d .mm .g svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible }
.d .mm .g svg polyline { fill: none; stroke: var(--bar); stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linejoin: round }
.d .mm .g svg .gl { stroke: rgba(20,40,60,.18); stroke-width: 1; stroke-dasharray: 2 2; vector-effect: non-scaling-stroke }
.d .mm .g svg polygon { fill: var(--bar); opacity: .28; stroke: none }
.d .mm span { width: 3.4em; text-align: right }
.d .ax { position: relative; flex: 1; height: 12px }
.d .ax b { position: absolute; top: 0; transform: translateX(-50%); font-weight: 400; white-space: nowrap }
.d .ax b:first-child { transform: none }
.d .lo { font-size: 15px; color: var(--sub); text-align: right }
.d .hi { font-size: 15px }
.track { position: relative; height: 5px; border-radius: 3px; background: rgba(20,40,60,.12) }
.seg { position: absolute; top: 0; bottom: 0; border-radius: 3px }
.dot { position: absolute; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px rgba(20,40,60,.55) }

.foot { font-size: 10px; color: var(--sub); text-align: right }
.foot a { color: inherit }
</style>
</head>
<body>
<div class="wrap">
  <div class="now">
    <div class="hl" id="clock">--:-- 更新</div>
    <div class="place">田無</div>
    <div class="temp" id="temp">--°</div>
    <div class="hl" id="hl">最高 --° 最低 --°</div>
    <div class="cond" id="cond">&nbsp;</div>
    <div class="umb" id="umb"></div>
  </div>

  <div class="card">
    <div class="title"><h1 id="ttl">雨の予想です</h1><p class="msg" id="msg">データを取ってきています…</p><p class="msg sum" id="sum24"></p></div>
    <div class="plot">
      <!-- 目盛り(1時間あたりの雨量)。言葉は気象庁「雨の強さと降り方」より -->
      <div class="dots" style="top:0"><span><b>50mm</b>滝のよう</span></div>
      <div class="dots" style="top:25%"><span><b>20mm</b>どしゃ降り</span></div>
      <div class="dots" style="top:50%"><span><b>10mm</b>ザーザー</span></div>
      <div class="dots" style="top:75%"><span><b>5mm</b></span></div>
      <div class="bars" id="bars"></div>
    </div>
    <div class="axis" id="axis"></div>
  </div>

  <div class="card">
    <div class="cap"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" style="vertical-align:-1px;margin-right:4px"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.5V8l2.5 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>1時間ごとの天気予報</div>
    <div class="hours" id="hours"></div>
  </div>

  <div class="card">
    <div class="cap"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" style="vertical-align:-1px;margin-right:4px"><rect x="1.75" y="3" width="12.5" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M1.75 6.5h12.5M5 1.5v3M11 1.5v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>7日間の天気予報<span style="float:right">天気・確率:気象庁(東京地方)</span></div>
    <div class="days" id="days"></div>
  </div>

  <div class="foot"><span id="upd"></span> 出典:<a href="https://www.jma.go.jp/bosai/nowc/" target="_blank" rel="noopener">気象庁ナウキャスト</a>・<a href="https://www.jma.go.jp/bosai/forecast/#area_type=offices&area_code=130000" target="_blank" rel="noopener">天気予報</a>を加工 / <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></div>
</div>
<script>
const LAT = 35.727, LON = 139.539, Z = 10;

/* ---------- 1時間の雨(気象庁ナウキャスト) ---------- */
const BASE = "https://www.jma.go.jp/bosai/jmatile/data/nowc/";
// 気象庁の凡例の色(弱い順)。h = 棒の高さ(%)。点線は 5mm=25% / 10mm=50% / 20mm=75% / 50mm=100%
// bar = 棒の色。暗い背景でも見えるよう気象庁の色を少し明るくしたもの
const LEVELS = [
  { rgb: null,          h: 0 },
  { rgb: [242,242,255], h: 10,  bar: "#b7dcff" }, // 1mm未満
  { rgb: [160,210,255], h: 25,  bar: "#5bb6f5" }, // 1〜5mm   → 5mmの線まで
  { rgb: [33,140,255],  h: 50,  bar: "#2f8fef" }, // 5〜10mm  → 10mmの線まで
  { rgb: [0,65,255],    h: 75,  bar: "#3b5bdb" }, // 10〜20mm → 20mmの線まで
  { rgb: [250,245,0],   h: 85,  bar: "#f5b800" }, // 20〜30mm
  { rgb: [255,153,0],   h: 100, bar: "#f08c00" }, // 30〜50mm → 50mmの線まで
  { rgb: [255,40,0],    h: 100, bar: "#e03131" }, // 50〜80mm
  { rgb: [180,0,104],   h: 100, bar: "#ae1e6c" }, // 80mm以上
];
const n = 2 ** Z;
const xf = (LON + 180) / 360 * n;
const lr = LAT * Math.PI / 180;
const yf = (1 - Math.log(Math.tan(lr) + 1 / Math.cos(lr)) / Math.PI) / 2 * n;
const TX = Math.floor(xf), TY = Math.floor(yf);
const PX = Math.floor((xf - TX) * 256), PY = Math.floor((yf - TY) * 256);

function levelOf(r, g, b, a) {
  if (a < 10) return 0;
  let best = 0, bd = 1e9;
  LEVELS.forEach((l, i) => { if (!l.rgb) return; const d = (l.rgb[0]-r)**2 + (l.rgb[1]-g)**2 + (l.rgb[2]-b)**2; if (d < bd) { bd = d; best = i; } });
  return best;
}
async function sample(basetime, validtime) {
  const r = await fetch(`${BASE}${basetime}/none/${validtime}/surf/hrpns/${Z}/${TX}/${TY}.png`);
  if (r.status === 404) return 0;           // 雨がない所は画像自体がない
  if (!r.ok) throw new Error(r.status);
  const bm = await createImageBitmap(await r.blob());
  const c = document.createElement("canvas"); c.width = bm.width; c.height = bm.height;
  const g = c.getContext("2d"); g.drawImage(bm, 0, 0);
  // 周り3×3マス(約450m四方)で一番強い値
  let lv = 0;
  const d = g.getImageData(Math.max(PX-1,0), Math.max(PY-1,0), 3, 3).data;
  for (let i = 0; i < d.length; i += 4) lv = Math.max(lv, levelOf(d[i], d[i+1], d[i+2], d[i+3]));
  return lv;
}
// 気象庁の時刻は世界標準時 → 日本時間
function toDate(s) { return new Date(Date.UTC(+s.slice(0,4), +s.slice(4,6)-1, +s.slice(6,8), +s.slice(8,10), +s.slice(10,12))); }
const hm = d => d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Tokyo" });

async function loadRain() {
  const [n1, n2] = await Promise.all(["targetTimes_N1.json", "targetTimes_N2.json"].map(f => fetch(BASE + f, { cache: "no-store" }).then(r => r.json())));
  const latest = n1[0].basetime;
  const fut = n2.filter(t => t.basetime === latest).sort((a, b) => a.validtime.localeCompare(b.validtime));
  const pts = [n1[0], ...fut];                                 // 現在 + 5分ごと1時間先まで
  const lvs = await Promise.all(pts.map(p => sample(p.basetime, p.validtime)));
  drawRain(lvs);
  document.getElementById("upd").textContent = `${hm(toDate(latest))} 時点`;
  return lvs;
}
function drawRain(lvs) {
  // 1分ごとの細い棒60本。値は5分ごとのデータをそのまま5本ずつ並べる(間を作り足さない)
  const mins = Array.from({ length: 60 }, (_, m) => lvs[Math.min(Math.floor(m / 5), lvs.length - 1)]);
  document.getElementById("bars").innerHTML = mins.map(lv => `<i style="height:${LEVELS[lv].h}%${lv ? `;background:${LEVELS[lv].bar}` : ""}"></i>`).join("");
  document.getElementById("axis").innerHTML = ["現在", "10分", "20分", "30分", "40分", "50分"].map((t, i) => `<span style="left:${i * 10 / 60 * 100}%">${t}</span>`).join("");
  const at = i => i * 5;                                        // i番目のデータ = 現在から何分後
  const ttl = document.getElementById("ttl"), msg = document.getElementById("msg");
  if (lvs[0]) {
    const stop = lvs.findIndex(l => !l);
    ttl.textContent = "雨が降っています";
    msg.textContent = stop > 0 ? `雨は${at(stop)}分後に止むことが予想されます。` : "今後1時間は雨が続くことが予想されます。";
  } else {
    const start = lvs.findIndex(l => l);
    ttl.textContent = start > 0 ? "雨の予想です" : "1時間以内の雨";
    msg.textContent = start > 0 ? `雨は${at(start)}分後に降り始めることが予想されます。` : "今後1時間は雨は予想されていません。";
  }
}

/* ---------- 上:現在の気温 / 下:1時間ごとの予報(Open-Meteo) ---------- */
// 天気アイコン(iPhone風:白い雲・黄色い太陽・水色の雨粒)
const SUN_C = "#f5a800", DROP_C = "#2f9bea", CLOUD_C = "#b3c1d0", INK = "#7c8b9a";
const CLOUD = (dy = 0, op = 1) => `<path transform="translate(0 ${dy})" opacity="${op}" fill="${CLOUD_C}" d="M9.5 25h13.5a5.5 5.5 0 0 0 .9-10.93A7.5 7.5 0 0 0 9.6 15.1 5 5 0 0 0 9.5 25z"/>`;
const SUN = (cx = 16, cy = 16, r = 5.5) => `<g stroke="${SUN_C}" stroke-width="2.2" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a => {
  const s = Math.sin(a * Math.PI / 180), c = Math.cos(a * Math.PI / 180);
  return `<line x1="${cx + c * (r + 2.5)}" y1="${cy + s * (r + 2.5)}" x2="${cx + c * (r + 5)}" y2="${cy + s * (r + 5)}"/>`; }).join("")}</g><circle cx="${cx}" cy="${cy}" r="${r}" fill="${SUN_C}"/>`;
const MOON = `<path fill="${INK}" d="M20 5.5a10.5 10.5 0 1 0 7 17.9A9 9 0 0 1 20 5.5z"/>`;
const DROPS = n => `<g stroke="${DROP_C}" stroke-width="2.2" stroke-linecap="round">${[11, 16, 21, 13.5, 18.5].slice(0, n).map((x, i) =>
  `<line x1="${x}" y1="${i < 3 ? 23 : 28}" x2="${x - 1.5}" y2="${i < 3 ? 27 : 31}"/>`).join("")}</g>`;
const ICONS = {
  clear:  d => d ? SUN() : MOON,
  partly: d => (d ? SUN(21, 11, 4.2) : `<g transform="translate(6 -3) scale(.7)">${MOON}</g>`) + CLOUD(3),
  cloudy: () => CLOUD(-1),
  fog:    () => CLOUD(-5) + `<g stroke="${INK}" stroke-width="2" stroke-linecap="round" opacity=".8"><line x1="7" y1="25" x2="25" y2="25"/><line x1="10" y1="29" x2="22" y2="29"/></g>`,
  drizzle:() => CLOUD(-5) + DROPS(2),
  rain:   () => CLOUD(-5) + DROPS(3),
  heavy:  () => CLOUD(-6) + DROPS(5),
  snow:   () => CLOUD(-5) + `<g fill="#7fb7e6">${[[11,25],[16,28],[21,25]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.6"/>`).join("")}</g>`,
  sunrain:() => SUN(21, 8, 3.8) + CLOUD(-4) + DROPS(2),
  thunder:() => CLOUD(-5) + `<path fill="${SUN_C}" d="M17 19l-4 7h3.5l-2 5 6-8h-3.5l2-4z"/>`,
  sunrise:() => `<clipPath id="hz"><rect width="32" height="22"/></clipPath><g clip-path="url(#hz)">${SUN(16, 22, 5)}</g><line x1="5" y1="22" x2="27" y2="22" stroke="${INK}" stroke-width="2" stroke-linecap="round"/><path d="M16 31v-6m-3 3l3-3 3 3" stroke="${INK}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
  sunset: () => `<clipPath id="hz2"><rect width="32" height="22"/></clipPath><g clip-path="url(#hz2)">${SUN(16, 22, 5)}</g><line x1="5" y1="22" x2="27" y2="22" stroke="${INK}" stroke-width="2" stroke-linecap="round"/><path d="M16 25v6m-3-3l3 3 3-3" stroke="${INK}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
};
const svg = (name, day = 1) => `<svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">${ICONS[name](day)}</svg>`;

// WMO天気コード → [アイコン, 言葉]
function wx(code, day) {
  const t = [
    [[0], "clear", "快晴"], [[1], "clear", "晴れ"], [[2], "partly", "所により曇り"], [[3], "cloudy", "曇り"],
    [[45, 48], "fog", "霧"], [[51, 53, 55, 56, 57], "drizzle", "霧雨"], [[61, 63, 66], "rain", "雨"],
    [[65, 67], "heavy", "大雨"], [[71, 73, 75, 77], "snow", "雪"], [[80, 81, 82], "rain", "にわか雨"],
    [[85, 86], "snow", "にわか雪"], [[95, 96, 99], "thunder", "雷雨"],
  ].find(r => r[0].includes(code)) || [[], "cloudy", ""];
  return { ic: svg(t[1], day), txt: t[2] };
}
// 気象庁の天気コード(100番台=晴れ、200番台=曇り、300番台=雨、400番台=雪)→ アイコン
function jmaIcon(code) {
  const n = +code, has = list => list.includes(n);
  const RAIN1 = [102,103,106,107,108,112,113,114,118,119,120,121,122,125,126,127,128,140,160,170,181];
  const SNOW1 = [104,105,115,116,117], SNOW2 = [204,205,215,216,217,228,229,230,250];
  if (n < 200) return has(SNOW1) ? "snow" : has(RAIN1) ? "sunrain" : has([101,110,111,132]) ? "partly" : "clear";
  if (n < 300) {
    if (n === 209) return "fog";
    if (has([208,219,240])) return "thunder";
    if (has(SNOW2)) return "snow";
    if (has([202,212,220,221,222,206,260])) return "drizzle";        // 一時雨
    if (has([203,207,213,214,218,224,225,226,270,281])) return "rain"; // 時々雨・後雨
    if (has([201,210,211,223])) return "partly";
    return "cloudy";
  }
  if (n < 400) return has([306,308,328]) ? "heavy" : n === 350 ? "thunder" : "rain";
  return "snow";
}
const JMA_FC = "https://www.jma.go.jp/bosai/forecast/data/forecast/130000.json";   // 東京都

const RAINY = new Set([51,53,55,56,57,61,63,65,66,67,71,73,75,77,80,81,82,85,86,95,96,99]);

async function loadWeather(rainNow) {
  const q = "current=temperature_2m,weather_code,is_day&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,is_day"
          + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,sunrise,sunset&timezone=Asia%2FTokyo&forecast_days=7";
  const w = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&${q}`, { cache: "no-store" }).then(r => r.json());
  const c = w.current;

  // 上
  let cond = wx(c.weather_code, c.is_day).txt;
  if (rainNow && !RAINY.has(c.weather_code)) cond = "雨";    // 今まさに降っているならナウキャストを優先
  document.getElementById("temp").textContent = `${Math.round(c.temperature_2m)}°`;
  document.getElementById("hl").textContent = `最高 ${Math.round(w.daily.temperature_2m_max[0])}° 最低 ${Math.round(w.daily.temperature_2m_min[0])}°`;
  document.getElementById("cond").textContent = cond;

  // 下:現在 + 1時間ごと。日の出・日の入りが入る時間なら間に差し込む
  const HF = w.hourly, items = [];
  const st = Math.max(0, HF.time.findIndex(t => t.slice(0, 13) >= c.time.slice(0, 13)));   // 今の時間から24時間分
  const H = Object.fromEntries(Object.keys(HF).map(k => [k, HF[k].slice(st, st + 24)]));
  const pop = p => (p == null || p < 10) ? "" : `${Math.round(p / 10) * 10}%`;
  const mmTxt = m => m == null ? "" : (m > 0 && m < 1) ? `${m.toFixed(1)}mm` : `${Math.round(m)}mm`;
  H.time.forEach((t, i) => {
    const e = wx(H.weather_code[i], H.is_day[i]);
    items.push({ t: i === 0 ? "現在" : `${+t.slice(11, 13)}時`, ic: i === 0 ? wx(c.weather_code, c.is_day).ic : e.ic,
                 p: pop(H.precipitation_probability?.[i]), v: `${Math.round(i === 0 ? c.temperature_2m : H.temperature_2m[i])}°`, mm: mmTxt(H.precipitation?.[i]), key: t });
  });
  // 一番上のひとこと:この先24時間に傘がいるか(雨量0.3mm以上の時間を「雨」とする)
  const today = c.time.slice(0, 10), wet = i => (H.precipitation[i] || 0) >= 0.3;
  const lab = t => `${t.slice(0, 10) !== today ? "明日" : ""}${+t.slice(11, 13)}時`;
  let umb;
  if (rainNow || wet(0)) {
    const k = H.time.findIndex((_, i) => i > 0 && !wet(i));
    umb = k < 0 ? "☂ この先24時間、雨が続く予報。傘いる" : `☂ 今は雨。${lab(H.time[k])}ごろまで降りそう。傘いる`;
  } else {
    const k = H.time.findIndex((_, i) => wet(i));
    if (k >= 0) umb = `☂ ${lab(H.time[k])}ごろから雨。出るなら傘いる`;
    else {
      const mp = Math.max(...H.precipitation_probability.map(v => v || 0));
      umb = mp >= 50 ? `この先24時間、雨は降らない予報(降水確率は最大${mp}%)。折りたたみ傘があると安心` : "この先24時間、傘はいらない";
    }
  }
  document.getElementById("umb").textContent = umb;
  const tot = H.precipitation.reduce((a, v) => a + (v || 0), 0);   // 今から24時間の雨量の合計
  document.getElementById("sum24").textContent = `今後24時間の雨量:${tot < 0.05 ? "0" : tot < 10 ? tot.toFixed(1) : Math.round(tot)}mm`;
  const first = H.time[0], last = H.time[H.time.length - 1];
  [...w.daily.sunrise.map(s => [s, svg("sunrise"), "日の出"]), ...w.daily.sunset.map(s => [s, svg("sunset"), "日の入"])]
    .filter(([s]) => s > first && s < last)
    .forEach(([s, ic, name]) => {
      const idx = items.findIndex(x => x.key > s);
      items.splice(idx, 0, { t: `${+s.slice(11, 13)}:${s.slice(14, 16)}`, ic, p: "", v: name, key: s, small: true });
    });
  document.getElementById("hours").innerHTML = items.map(x =>
    `<div class="h"><div class="t">${x.t}</div><div class="ic">${x.ic}</div><div class="p">${x.p}</div><div class="mm">${x.mm || ""}</div><div class="v"${x.small ? ' style="font-size:13px"' : ""}>${x.v}</div></div>`).join("");

  // 7日間:曜日・天気・降水確率・雨量・最低・気温の幅の棒・最高
  // 天気と降水確率は気象庁の週間予報(東京地方)、雨量は Open-Meteo(田無)。気象庁が取れない時は Open-Meteo だけで出す
  const D = w.daily;
  const days = D.time.map((t, i) => ({ t, ic: wx(D.weather_code[i], 1).ic, p: pop(D.precipitation_probability_max?.[i]),
                                       mm: D.precipitation_sum?.[i], mn: D.temperature_2m_min[i], mx: D.temperature_2m_max[i] }));
  try {
    const j = await fetch(JMA_FC, { cache: "no-store" }).then(r => r.json());
    const put = (date, code, p) => { const d = days.find(x => x.t === date); if (!d) return;
      if (code) d.ic = svg(jmaIcon(code)); if (p !== undefined && p !== "") d.p = `${p}%`; };
    // 今日・明日(・明後日):短期予報の天気と、その日の6時間ごとの降水確率のうち一番高いもの
    const s0 = j[0].timeSeries[0], s1 = j[0].timeSeries[1];
    const pDay = date => { const v = s1.timeDefines.map((d, k) => d.startsWith(date) ? +s1.areas[0].pops[k] : -1).filter(x => x >= 0);
                           return v.length ? Math.max(...v) : undefined; };
    const short = new Set();
    s0.timeDefines.forEach((d, k) => { const date = d.slice(0, 10); short.add(date); put(date, s0.areas[0].weatherCodes[k], pDay(date)); });
    // それより先:週間予報
    const wk = j[1].timeSeries[0], wt = j[1].timeSeries[1];
    wk.timeDefines.forEach((d, k) => { const date = d.slice(0, 10);
      if (!short.has(date)) put(date, wk.areas[0].weatherCodes[k], wk.areas[0].pops[k]);
      else if (pDay(date) === undefined) put(date, null, wk.areas[0].pops[k]); });   // 短期予報に確率がない日は週間予報の確率
    wt.timeDefines.forEach((d, k) => { const x = days.find(y => y.t === d.slice(0, 10)); if (!x) return;
      const a = wt.areas[0]; if (a.tempsMin[k] !== "") x.mn = +a.tempsMin[k]; if (a.tempsMax[k] !== "") x.mx = +a.tempsMax[k]; });
  } catch (e) { /* 気象庁が取れなければ Open-Meteo のまま */ }

  const lo = Math.min(...days.map(d => d.mn)), hi = Math.max(...days.map(d => d.mx));
  const pos = t => (hi === lo ? 50 : (t - lo) / (hi - lo) * 100);
  const col = t => t < 10 ? "#5ac8fa" : t < 17 ? "#6fd3b0" : t < 23 ? "#b5dc52" : t < 28 ? "#ffd23f" : "#ff9f0a";
  const mmMax = Math.max(10, ...days.map(d => d.mm || 0));   // 棒の長さの基準:その週で一番多い日(最低でも10mm)
  // 雨量の折れ線:1日ごとに、横=0時〜24時、縦=1時間あたりの雨量(どの日も同じ縦の目盛り)
  const yMax = Math.max(5, ...HF.precipitation.map(v => v || 0));
  const lineOf = i => {
    const v = HF.time.map((t, k) => t.startsWith(days[i].t) ? HF.precipitation[k] || 0 : null).filter(x => x !== null);
    if (v.length < 2) return "";
    const pts = v.map((m, h) => `${h / (v.length - 1) * 100},${100 - Math.min(m / yMax, 1) * 100}`).join(" ");
    return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path class="gl" d="M25 0V100M50 0V100M75 0V100"/><polygon points="0,100 ${pts} 100,100"/><polyline points="${pts}"/></svg>`;
  };
  const mm = v => v == null ? "" : v < 0.5 ? "0mm" : v < 10 ? `${v.toFixed(1)}mm` : `${Math.round(v)}mm`;
  document.getElementById("days").innerHTML =
    `<div class="d head"><div></div><div></div><div>確率</div><div class="mm" style="margin:0"><div class="ax"><b style="left:0">0時</b><b style="left:25%">6</b><b style="left:50%">12</b><b style="left:75%">18</b></div><span>合計</span></div><div></div><div></div><div></div></div>` +
    days.map((d, i) => {
      const wd = i === 0 ? "今日" : "日月火水木金土"[new Date(d.t + "T00:00:00Z").getUTCDay()];   // 日付だけで曜日を出す(見る人の時差に左右されない)
      const dot = i === 0 ? `<i class="dot" style="left:${pos(c.temperature_2m)}%"></i>` : "";
      return `<div class="d"><div class="w">${wd}</div><div class="ic">${d.ic}</div>`
           + `<div class="p">${d.p}</div><div class="mm"><div class="g">${lineOf(i)}</div><span>${mm(d.mm)}</span></div><div class="lo">${Math.round(d.mn)}°</div>`
           + `<div class="track"><i class="seg" style="left:${pos(d.mn)}%;width:${pos(d.mx) - pos(d.mn)}%;background:linear-gradient(90deg,${col(d.mn)},${col(d.mx)})"></i>${dot}</div>`
           + `<div class="hi">${Math.round(d.mx)}°</div></div>`;
    }).join("");
}

async function load() {
  document.getElementById("clock").textContent = `${hm(new Date())} 更新`;   // 読み込んだ時刻(5分ごとに変わる)
  let rainNow = 0;
  try { rainNow = (await loadRain())[0]; }
  catch (e) { document.getElementById("msg").textContent = "雨のデータを取れませんでした。少し待って再読み込みしてください。"; }
  try { await loadWeather(rainNow); }
  catch (e) { document.getElementById("cond").textContent = "気温のデータを取れませんでした"; }
}
load();
setInterval(load, 5 * 60 * 1000);
</script>
