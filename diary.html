<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一日の記録</title>
<style>
  :root{--bg:#fff;--card:#f3f6fb;--line:#d6dce5;--ink:#1b2733;--mute:#5d6b79;--blue:#1c7ed6;--red:#e03131}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;padding:6px 8px}
  .card{background:var(--card);border-radius:16px;padding:10px 14px 10px}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:6px}
  .date{font-weight:700;font-size:15px;margin-right:auto}
  button,select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:4px 9px;cursor:pointer;white-space:nowrap}
  button.save{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
  button.reset{color:var(--red);border-color:#f0b8b8}
  .head{padding:0 130px 8px 4px}  /* 右上にNotionの小さな道具が出るので、あけておく。大きさはカレンダーの上の一行と同じ */
  .hd{font-size:19px;font-weight:600;line-height:1.45}
  .hd .blue{color:#2b7fd0;font-weight:700;margin-right:6px}
  .hs{font-size:15px;color:var(--mute);font-weight:400;margin-left:16px}
  .nav{display:flex;flex:1 1 200px;gap:4px;min-width:0}
  .nav select{flex:1 1 auto;min-width:0}
  .msg{font-size:12px;color:var(--mute);min-width:90px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:440px){.cols{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;table-layout:fixed}
  th,td{border:1px solid var(--line);padding:0;font-size:12px}
  th{background:#eef1f6;color:var(--mute);font-weight:600;padding:3px 4px;text-align:left}
  td.t{width:44px;text-align:center;color:var(--mute);background:#f8f9fb;font-variant-numeric:tabular-nums}
  td input{width:100%;border:0;background:transparent;font:inherit;font-size:12px;padding:1px 5px;height:22px;color:var(--ink);outline:none}
  .note{display:flex;gap:8px;align-items:center;margin-bottom:9px}
  .note b{font-size:12px;color:var(--mute);white-space:nowrap}
  .note input{flex:1;min-width:0;height:26px;font:inherit;font-size:13px;padding:2px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);outline:none}
  .note input:focus{background:#eef6ff}
  td input:focus{background:#eef6ff}
  td{position:relative}
  td.blk{background:rgba(28,126,214,.13)}
  td.blk.a{background:rgba(47,184,138,.16)}
  td.blk.m,td.blk.s{border-bottom-color:transparent}
  td.blk.m input{color:#8aa0b5}
  .grip{position:absolute;left:0;right:0;bottom:-1px;height:8px;cursor:ns-resize;display:none;touch-action:none;z-index:3;background:linear-gradient(to bottom,transparent,rgba(28,126,214,.55))}
  td.a .grip{background:linear-gradient(to bottom,transparent,rgba(47,184,138,.7))}
  td:hover .grip,.grip.on{display:block}
  td.now{background:#fff6d6}
  #bk{display:none;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}
  #bk .bt{font-size:12px;color:var(--mute);line-height:1.5}
  #bk .bt b{color:var(--ink)}
  #bk textarea{flex:1;min-height:0;width:100%;resize:none;font:11px/1.4 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:6px;padding:6px;color:var(--ink);outline:none}
  #bk .bb{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
  #bk .bb span{font-size:12px;color:var(--mute)}
  #mv{display:none;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:auto}
  #mv .mh{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:4px 8px;background:#eef1f6;font-size:13px;font-weight:600}
  #mv .mh span{margin-right:auto}
  #mv .mh button{padding:2px 8px;font-size:12px}
  .mrow{display:flex;gap:10px;padding:0 8px;height:22px;align-items:center;border-top:1px solid var(--line);font-size:12px;cursor:pointer}
  .mrow:hover{background:#eef6ff}
  .mrow .md{width:62px;flex:none;color:var(--mute);font-variant-numeric:tabular-nums}
  .mrow .mn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrow.sun .md{color:#d9534f}.mrow.sat .md{color:#2b7fd0}.mrow.today{background:#fff6d6}
</style>
</head>
<body>
<div class="head"><div class="hd" id="date"></div></div>
<div class="card">
  <div class="bar">
    <div class="nav"><button id="prev" title="前の日">‹ 前日</button><select id="past" title="保存した日を開く"><option value="">過去の日</option></select><button id="next" title="次の日">翌日 ›</button><button id="tod" title="今日">今日</button></div>
    <button id="imp" style="display:none">予定取込</button>
    <button id="mon" title="1か月分の一行日記を、まとめて見る">月の一行日記</button>
    <button id="bak" title="全部の日記を文字にして、Notionなどに貼っておく(消えたときは、ここから戻せる)">バックアップ</button>
    <span class="msg" id="msg"></span>
  </div>
  <div class="note" id="noterow"><b>一行日記</b><input type="text" data-k="note" placeholder="今日の一行日記" autocomplete="off"></div>
  <div class="cols" id="cols"></div>
  <div id="mv"></div>
  <div id="bk">
    <div class="bt">全部の日記を、下の文字にまとめました。<b>コピーして、Notionのページに貼っておく</b>と、バックアップになります。消えたときは、貼った文字をここに入れて「読み込む」を押すと戻ります。</div>
    <textarea id="bkta" spellcheck="false"></textarea>
    <div class="bb"><button id="bkcopy">コピー</button><button id="bkload">この内容を読み込む(同じ日は上書き)</button><button id="bkback">日記にもどる</button><span id="bkmsg"></span></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search),GSRC=Q.get("g"),GKEY=Q.get("k");   // Googleカレンダーの取り込み用(アドレスで渡す)
const S=[];for(let m=6*60+30;m<=23*60;m+=30)S.push(Math.floor(m/60)+":"+String(m%60).padStart(2,"0"));
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const W="日月火水木金土";
let cur=ymd(new Date());   // いま開いている日
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

// 表を作る(左半分 7:00〜15:00、右半分 15:30〜23:30)
const half=Math.ceil(S.length/2);
$("cols").innerHTML=[S.slice(0,half),S.slice(half)].map(g=>'<table><colgroup><col style="width:44px"><col><col></colgroup><tr><th>時間</th><th>予定</th><th>実際</th></tr>'+g.map(t=>'<tr><td class="t" data-t="'+t+'">'+t+'</td><td><input data-k="p'+t+'" autocomplete="off"></td><td><input data-k="a'+t+'" autocomplete="off"></td></tr>').join("")+'</table>').join("");

const inputs=[...document.querySelectorAll("input[data-k],textarea[data-k]")];
const read=()=>{const o={};inputs.forEach(i=>{if(i.value)o[i.dataset.k]=i.value});return o};
const fill=o=>{inputs.forEach(i=>{i.value=(o&&o[i.dataset.k])||""});if(window.decorate)decorate()};
function label(k){const d=new Date(k+"T00:00:00");return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日("+W[d.getDay()]+")"}
function say(t){$("msg").textContent=t;clearTimeout(say.t);say.t=setTimeout(()=>$("msg").textContent="",4000)}
function savedDates(){const a=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("diary:day:"))a.push(k.slice(10))}}catch(e){}return a.sort().reverse()}
function refreshPast(){
  const a=savedDates(),today=ymd(new Date());
  $("past").innerHTML='<option value="">過去の日</option>'+(cur!==today?'<option value="'+today+'">今日に戻る</option>':"")+a.map(k=>'<option value="'+k+'">'+label(k)+'</option>').join("");
  $("past").value="";
}
function show(k){if(window.closeMonth)closeMonth();cur=k;{const d=new Date(k+"T00:00:00"),t=(d.getMonth()+1)+"/"+d.getDate()+"("+W[d.getDay()]+")";$("date").innerHTML='<span class="blue">'+(k===ymd(new Date())?"今日 ":"")+t+'</span> <span id="cnt"></span><span class="hs" id="allday"></span>';$("allday").textContent=""}const s=ls.get("diary:day:"+k);const dr=JSON.parse(ls.get("diary:draft:"+k)||"null");
  // 下書きがその日のものなら、保存前の入力を優先して戻す
  fill(dr?dr.data:(s?JSON.parse(s):{}));refreshPast();mark();if(GSRC)importCal(false,!ls.get("diary:cal:"+k))}
// 書くたびに自動で保存する(保存ボタンはなし)。何も書いてない日は、保存した日の一覧には入れない
function draft(){
  const d=read(),has=Object.keys(d).length>0,key="diary:day:"+cur,had=ls.get(key)!==null;
  const ok=ls.set("diary:draft:"+cur,JSON.stringify({date:cur,data:d}));
  if(has)ls.set(key,JSON.stringify(d));else ls.del(key);
  if(has!==had)refreshPast();
  say(ok?"自動で保存しました":"保存できませんでした");
}
function mark(){ // いまの時間帯の行に色をつける(今日のときだけ)
  document.querySelectorAll("td.t").forEach(td=>td.classList.remove("now"));
  if(cur!==ymd(new Date()))return;
  const n=new Date(),m=n.getHours()*60+(n.getMinutes()>=30?30:0),t=Math.floor(m/60)+":"+String(m%60).padStart(2,"0");
  const td=document.querySelector('td.t[data-t="'+t+'"]');if(td)td.classList.add("now");
}
// 入れた予定(文字の入ったマス)を、下にドラッグして伸ばす。伸ばした分のマスには「↓」が入る
const cellsOf=pre=>S.map(t=>document.querySelector('input[data-k="'+pre+t+'"]'));
const tabOf=i=>i<half?0:1, tabEnd=i=>tabOf(i)===0?half-1:S.length-1;
let drag=null;
function decorate(){
  const olds=[...document.querySelectorAll(".grip")];const reuse=drag?drag.grip:null;
  document.querySelectorAll("td.blk").forEach(td=>td.classList.remove("blk","s","m","e","a"));
  for(const pre of["p","a"]){
    const c=cellsOf(pre);
    for(let i=0;i<c.length;i++){
      const v=c[i].value;if(!v||v==="↓")continue;
      let j=i+1;while(j<c.length&&tabOf(j)===tabOf(i)&&c[j].value==="↓")j++;
      for(let k=i;k<j;k++){const td=c[k].parentElement;td.classList.add("blk");if(pre==="a")td.classList.add("a");td.classList.add(k===j-1?"e":(k===i?"s":"m"))}
      const endTd=c[j-1].parentElement;let g=(reuse&&drag.pre===pre&&drag.i0===i)?reuse:null;
      if(!g){g=document.createElement("div");g.className="grip";g.title="下にドラッグして伸ばす";bindGrip(g,pre,i)}
      g._pre=pre;g._i0=i;g._len=j-i;endTd.appendChild(g);olds.splice(olds.indexOf(g),1);
      i=j-1;
    }
  }
  olds.forEach(g=>{if(g!==reuse)g.remove()});
}
function bindGrip(g,pre,i0){
  g.addEventListener("pointerdown",e=>{
    e.preventDefault();
    // 持ち手は伸ばすたびに別のマスへ移るので、動きの受け取りは、動かない「ページ全体」にする
    try{document.documentElement.setPointerCapture(e.pointerId)}catch(_){}
    g.classList.add("on");
    const td=g.parentElement,h=td.getBoundingClientRect().height||23;
    drag={grip:g,pre:g._pre,i0:g._i0,L:g._len,y0:e.clientY,h,id:e.pointerId};
    window.addEventListener("pointermove",onMove);window.addEventListener("pointerup",onEnd);window.addEventListener("pointercancel",onEnd);
  });
}
function onMove(e){
  if(!drag)return;
  const c=cellsOf(drag.pre),d=Math.round((e.clientY-drag.y0)/drag.h);let L=Math.max(1,drag.L+d);
  L=Math.min(L,tabEnd(drag.i0)-drag.i0+1);
  for(let k=drag.i0+1;k<drag.i0+L;k++){const v=c[k].value;if(v&&v!=="↓"){L=k-drag.i0;break}}
  for(let k=drag.i0+1;k<drag.i0+L;k++)c[k].value="↓";
  let k=drag.i0+L;while(k<c.length&&tabOf(k)===tabOf(drag.i0)&&c[k].value==="↓"){c[k].value="";k++}
  decorate();
}
function onEnd(){
  window.removeEventListener("pointermove",onMove);window.removeEventListener("pointerup",onEnd);window.removeEventListener("pointercancel",onEnd);
  if(!drag)return;drag.grip.classList.remove("on");try{document.documentElement.releasePointerCapture(drag.id)}catch(_){}
  drag=null;draft();decorate();
}
inputs.forEach(i=>i.addEventListener("input",()=>{draft();decorate()}));
// Googleカレンダーの予定を、その日の「予定」の空いているマスに入れる
const hmOf=d=>{const p=new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Tokyo",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(d);return +p.slice(0,2)*60+ +p.slice(3,5)};
async function importCal(manual,fill){
  if(!GSRC)return;const day=cur;
  const t0=new Date(day+"T00:00:00+09:00"),t1=new Date(t0.getTime()+86400000);
  try{
    const r=await fetch(GSRC+(GSRC.includes("?")?"&":"?")+"k="+encodeURIComponent(GKEY||"")+"&from="+t0.toISOString()+"&to="+t1.toISOString());
    const j=await r.json();if(day!==cur)return;
    const ev=(j.events||[]).map(e=>({t:e.t,a:e.a,s:new Date(e.s),e:new Date(e.e)})).filter(e=>e.e>t0&&e.s<t1);
    const all=ev.filter(e=>e.a).map(e=>e.t);
    const nowT=new Date(),nxt=day===ymd(nowT)?ev.filter(e=>!e.a&&e.e>nowT).sort((x,y)=>x.s-y.s)[0]:null,parts=[];
    if(all.length)parts.push("終日: "+all.join("、"));
    if(nxt){const m=hmOf(nxt.s);parts.push("次 "+Math.floor(m/60)+":"+String(m%60).padStart(2,"0")+" "+nxt.t)}
    $("allday").textContent=parts.join("　");$("cnt").textContent=ev.length?"予定 "+ev.length+"件":"予定なし";
    let n=0;
    if(fill)ev.filter(e=>!e.a).sort((x,y)=>x.s-y.s).forEach(e=>{
      const a=Math.max(e.s,t0),b=Math.min(e.e,t1),sm=hmOf(new Date(a)),em=(b>=t1?1440:hmOf(new Date(b)));
      for(let m=6*60+30;m<=23*60;m+=30){
        if(m+30<=sm||m>=em)continue;
        const t=Math.floor(m/60)+":"+String(m%60).padStart(2,"0"),inp=document.querySelector('input[data-k="p'+t+'"]');
        if(inp&&!inp.value){inp.value=(m<=sm&&sm<m+30)?e.t:"↓";n++}
      }
    });
    decorate();if(fill){draft();ls.set("diary:cal:"+day,"1")}
    if(manual)say(n?"取り込みました":"取り込む予定がありません");
  }catch(err){if(manual)say("取り込めませんでした")}
}
if(GSRC)$("imp").style.display="";
$("imp").onclick=()=>importCal(true,true);
function go(d){draft();show(d)}
const shift=n=>{const d=new Date(cur+"T00:00:00");d.setDate(d.getDate()+n);return ymd(d)};
$("prev").onclick=()=>go(shift(-1));$("next").onclick=()=>go(shift(1));$("tod").onclick=()=>go(ymd(new Date()));
$("past").onchange=e=>{const k=e.target.value;if(!k)return;if(k===cur){ls.del("diary:draft:"+cur)}else{draft()}show(k)};
// 1か月分の一行日記を、まとめて見る(日付をおすと、その日の記録にもどる)
let mv=null;
function closeMonth(){mv=null;$("mv").style.display="none";$("bk").style.display="none";$("cols").style.display="";$("noterow").style.display="";$("mon").textContent="月の一行日記"}
function monthKey(y,m){return y+"-"+String(m).padStart(2,"0")}
function renderMonth(){
  const [y,m]=mv.split("-").map(Number),n=new Date(y,m,0).getDate(),today=ymd(new Date());
  let rows="",cnt=0;
  for(let d=1;d<=n;d++){
    const k=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0"),dow=new Date(y,m-1,d).getDay();
    let note="";try{note=(JSON.parse(ls.get("diary:day:"+k)||"{}").note||"").trim()}catch(e){}
    if(note)cnt++;
    rows+='<div class="mrow'+(dow===0?" sun":dow===6?" sat":"")+(k===today?" today":"")+'" data-d="'+k+'"><span class="md">'+m+"/"+d+"("+W[dow]+')</span><span class="mn" title="'+note.replace(/"/g,"&quot;")+'">'+note.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+"</span></div>";
  }
  $("mv").innerHTML='<div class="mh"><span>'+y+"年"+m+"月の一行日記(書いた日 "+cnt+"日)</span><button id=\"mprev\">‹ 前の月</button><button id=\"mnext\">次の月 ›</button><button id=\"mback\">日記にもどる</button></div>"+rows;
  $("mprev").onclick=()=>{const d=new Date(y,m-2,1);mv=monthKey(d.getFullYear(),d.getMonth()+1);renderMonth()};
  $("mnext").onclick=()=>{const d=new Date(y,m,1);mv=monthKey(d.getFullYear(),d.getMonth()+1);renderMonth()};
  $("mback").onclick=closeMonth;
  $("mv").querySelectorAll(".mrow").forEach(r=>r.onclick=()=>{go(r.dataset.d)});
}
$("mon").onclick=()=>{
  if(mv){closeMonth();return}
  $("bk").style.display="none";
  const h=$("cols").offsetHeight+$("noterow").offsetHeight+9;
  const d=new Date(cur+"T00:00:00");mv=monthKey(d.getFullYear(),d.getMonth()+1);
  $("cols").style.display="none";$("noterow").style.display="none";
  $("mv").style.display="block";$("mv").style.height=h+"px";$("mon").textContent="日記にもどる";
  renderMonth();
};
// バックアップ:全部の日記を文字にして出す / 貼った文字から戻す
function bkSay(t){$("bkmsg").textContent=t}
function allDaysText(){
  const o={};savedDates().slice().reverse().forEach(k=>{try{o[k]=JSON.parse(ls.get("diary:day:"+k))}catch(e){}});
  const ks=Object.keys(o);
  return ks.length?"{\n"+ks.map(k=>JSON.stringify(k)+":"+JSON.stringify(o[k])).join(",\n")+"\n}":"{}";
}
$("bak").onclick=()=>{
  const open=$("bk").style.display==="flex";
  if(open){closeMonth();return}
  const h=$("cols").offsetHeight+$("noterow").offsetHeight+9;
  closeMonth();
  $("cols").style.display="none";$("noterow").style.display="none";
  $("bk").style.display="flex";$("bk").style.height=h+"px";
  $("bkta").value=allDaysText();bkSay("");$("mon").textContent="月の一行日記";
};
$("bkback").onclick=closeMonth;
$("bkcopy").onclick=()=>{
  const ta=$("bkta");ta.focus();ta.select();
  const done=()=>bkSay("コピーしました。Notionのページに貼ってください");
  const fail=()=>{try{if(document.execCommand("copy")){done();return}}catch(e){}bkSay("自動でコピーできません。文字を選んだので、Ctrl+C でコピーしてください")};
  try{navigator.clipboard.writeText(ta.value).then(done,fail)}catch(e){fail()}
};
$("bkload").onclick=()=>{
  let o;try{o=JSON.parse($("bkta").value)}catch(e){bkSay("読み込めません。貼った文字が、途中で切れていないか見てください");return}
  if(!o||typeof o!=="object"||Array.isArray(o)){bkSay("読み込めません。形が違います");return}
  let n=0;
  for(const k of Object.keys(o)){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!o[k]||typeof o[k]!=="object")continue;
    ls.set("diary:day:"+k,JSON.stringify(o[k]));ls.del("diary:draft:"+k);n++;
  }
  refreshPast();bkSay(n+"日分を読み込みました");
  if(n&&o[cur])fill(o[cur]);
};
show(cur);
setInterval(mark,30000);
</script>
</body>
</html>
