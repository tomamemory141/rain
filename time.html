<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>時間の進み具合</title>
<style>
/* 今日・今週・今月・今年・人生が、どれだけ進んだかを棒で出す。誕生日は ?b=1992-12-01 のようにアドレスで渡す(ページの中には書かない) */
:root { --sky1: #3a4a5e; --sky2: #26313f; --fg: #fff; --sub: rgba(255,255,255,.72); --font: -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif; color-scheme: dark }
* { box-sizing: border-box }
html, body { margin: 0 }
body { background: linear-gradient(160deg, var(--sky1), var(--sky2)); color: var(--fg); font-family: var(--font); padding: 6px 12px; min-height: 100vh }
.wrap { max-width: 560px; display: grid; gap: 8px }
.row { display: grid; grid-template-columns: 7em 1fr 3.9em max-content; align-items: center; gap: 8px }
.row .n { font-size: 15px; font-weight: 700; white-space: nowrap }
.row .n small { font-size: 11px; font-weight: 400; color: var(--sub); margin-left: 5px }
.row .pct { font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700 }
.bar { position: relative; height: 14px; border-radius: 7px; background: rgba(0,0,0,.28); overflow: hidden }
.bar b { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; border-left: 1px solid rgba(20,30,45,.65); border-right: 1px solid rgba(255,255,255,.45) }
.bar i { display: block; height: 100%; border-radius: 7px; background: var(--c); min-width: 3px }
.left { font-size: 12px; color: var(--sub); white-space: nowrap }
.cd { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 4px 0 0; border-top: 1px solid rgba(255,255,255,.28) }
.cd .n { font-size: 15px; font-weight: 700; flex: 1 1 auto; white-space: nowrap }
.cd .memo { width: 100%; font-size: 11px; color: var(--sub); line-height: 1.4 }
.cd .n small { font-size: 11px; font-weight: 400; color: var(--sub); margin-left: 6px }
.cd .d { font-size: 26px; font-weight: 300; font-variant-numeric: tabular-nums }
.cd .u { font-size: 12px; color: var(--sub); white-space: nowrap }
.cd .dt { font-size: 11px; color: var(--sub); width: 100% }
.foot { font-size: 10px; color: var(--sub); text-align: right }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<div class="foot" id="foot"></div>
<script>
const q = new URLSearchParams(location.search);
const born = q.get("b") ? new Date(q.get("b") + "T00:00:00") : null;   // 誕生日
// 試験などの日付。アドレスに ?x=電験三種@2027-09-05@メモ のように付ける(メモは省略できる。複数は &x=… を並べる)
const EVENTS = q.getAll("x").map(t => { const [name, date, ...m] = t.split("@"); return { name, date: new Date(date + "T00:00:00"), memo: m.join("@") }; }).filter(e => e.name && !isNaN(e.date));
const LIFE = +q.get("age") || 81;                                      // 何歳までで数えるか(日本人男性の平均寿命は約81歳)

function span(unit, now) {
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  if (unit === "day")   return [new Date(y, m, d), new Date(y, m, d + 1)];
  if (unit === "week")  { const dow = (now.getDay() + 6) % 7; return [new Date(y, m, d - dow), new Date(y, m, d - dow + 7)]; }   // 月曜はじまり
  if (unit === "month") return [new Date(y, m, 1), new Date(y, m + 1, 1)];
  if (unit === "year")  return [new Date(y, 0, 1), new Date(y + 1, 0, 1)];
  const end = new Date(born); end.setFullYear(end.getFullYear() + LIFE);
  return [born, end];
}
const fmtLeft = (ms, unit) => {
  const min = Math.max(0, Math.floor(ms / 60000)), h = Math.floor(min / 60), day = ms / 86400000;
  if (unit === "day") return `あと ${h}時間${min % 60}分`;
  if (unit === "life") return `あと ${(day / 365.25).toFixed(1)}年(${Math.round(day).toLocaleString()}日)`;
  return `あと ${day >= 1 ? Math.floor(day) + "日" : ""}${day >= 1 ? "" : h + "時間"}`;
};
// 棒の区切り(今日=6時間ずつ / 今週=1日ずつ / 今月=5日ずつ / 今年=1か月ずつ / 人生=5年ずつ)。0〜1の位置で返す
function ticks(unit, a, b) {
  const t = [], r = d => (d - a) / (b - a);
  if (unit === "day") for (let h = 6; h < 24; h += 6) t.push(h / 24);
  if (unit === "week") for (let d = 1; d < 7; d++) t.push(d / 7);
  if (unit === "month") { const n = Math.round((b - a) / 86400000); for (let d = 5; d < n; d += 5) t.push(d / n); }
  if (unit === "year") for (let m = 1; m < 12; m++) t.push(r(new Date(a.getFullYear(), m, 1)));
  if (unit === "life") for (let y = 5; y < LIFE; y += 5) { const d = new Date(a); d.setFullYear(d.getFullYear() + y); t.push(r(d)); }
  return t;
}
const ROWS = [["day", "今日", "#8fd4ff"], ["week", "今週", "#6fd3b0"], ["month", "今月", "#b5dc52"], ["year", "今年", "#ffd23f"], ["life", "人生", "#ff9f0a"]];

function draw() {
  const now = new Date();
  // 名前の横に出す「いま」: 今日=何時 / 今週=何曜日 / 今月=何日 / 今年=何年 / 人生=何年(満年数)
  const yrs = born ? now.getFullYear() - born.getFullYear() - (now < new Date(now.getFullYear(), born.getMonth(), born.getDate()) ? 1 : 0) : null;
  const SUB = { day: `${now.getHours()}時`, week: `${"日月火水木金土"[now.getDay()]}曜日`, month: `${now.getDate()}日`, year: `${now.getFullYear()}年`, life: yrs === null ? "" : `${yrs}年・${Math.floor((now - born) / 86400000).toLocaleString()}日` };
  document.getElementById("wrap").innerHTML = ROWS.map(([u, name, c]) => {
    if (u === "life" && !born) return `<div class="row"><div class="n">${name}</div><div class="left" style="grid-column:2/-1;white-space:normal">誕生日が未設定です(アドレスの最後に ?b=1990-01-01 のように付けます)</div></div>`;
    const [a, b] = span(u, now), p = Math.min(100, Math.max(0, (now - a) / (b - a) * 100));
    return `<div class="row"><div class="n">${name}<small>${SUB[u]}</small></div><div class="bar"><i style="width:${p}%;--c:${c}"></i>${ticks(u, a, b).map(f => `<b style="left:${f * 100}%"></b>`).join("")}</div><div class="pct">${p.toFixed(1)}%</div><div class="left">${fmtLeft(b - now, u)}</div></div>`;
  }).join("");
  const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  document.getElementById("wrap").innerHTML += EVENTS.map(e => {
    const days = Math.round((e.date - t0) / 86400000);
    const w = `${e.date.getMonth() + 1}月${e.date.getDate()}日(${"日月火水木金土"[e.date.getDay()]})`;
    const wk = days >= 7 ? `・あと${Math.floor(days / 7)}週間` : "";   // 試験の名前の横に「何月何日・あと何週間」
    return days < 0 ? `<div class="cd"><div class="n">${e.name}<small>${w}</small></div><div class="u">終わりました</div>${e.memo ? `<div class="memo">${e.memo}</div>` : ""}</div>`
      : `<div class="cd"><div class="n">${e.name}<small>${w}${wk}</small></div><div class="d">${days === 0 ? "今日" : days}</div><div class="u">${days === 0 ? "" : "日後"}</div>${e.memo ? `<div class="memo">${e.memo}</div>` : ""}</div>`;
  }).join("");
  document.getElementById("foot").textContent = born ? `人生は ${LIFE}歳までで計算` : "";
}
draw();
setInterval(draw, 30 * 1000);
</script>
</body>
</html>
