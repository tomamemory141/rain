<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ステータス</title>
<style>
/* 体重が目標までどれだけ進んだかを棒で、体重・BMI・体脂肪率・筋肉量の履歴を折れ線で出す。
   数字はアドレスで渡す: w=今の体重 s=はじめの体重 g=目標 ht=身長(cm) d=測定日
   h=体重の履歴 / f=体脂肪率の履歴 / m=筋肉量の履歴(どれも 9/10:74.9,9/11:75.5 … の形)。BMIは体重と身長から計算する */
:root { --fg: #1b2733; --sub: #5d6b79; --font: -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif; color-scheme: light }
* { box-sizing: border-box }
html, body { margin: 0 }
body { background: #fff; color: var(--fg); font-family: var(--font); padding: 6px 12px; min-height: 100vh }
.wrap { max-width: 560px; display: grid; gap: 8px; background: #f3f6fa; border-radius: 16px; padding: 8px 14px 10px }
.cap { font-size: 12px; color: var(--sub); padding-bottom: 4px; border-bottom: 1px solid rgba(20,40,60,.14) }
.row { display: grid; grid-template-columns: 112px 1fr 56px 112px; align-items: center; gap: 8px }
.row .n { font-size: 15px; font-weight: 700; white-space: nowrap }
.row .n small { display: block; font-size: 11px; font-weight: 400; color: var(--sub) }
.row .pct { font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700 }
.bar { position: relative; height: 12px; border-radius: 7px; background: rgba(20,40,60,.09); overflow: hidden }
.bar i { display: block; height: 100%; border-radius: 7px; background: var(--c); min-width: 3px }
.left { font-size: 12px; color: var(--sub); white-space: nowrap }
.card { background: #fff; border-radius: 12px; padding: 6px 10px 2px; border-left: 5px solid var(--c) }
.card .hd { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 8px }
.card .hd b { font-size: 14px }
.card .hd .big { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--c) }
.card .hd small { font-size: 11px; color: var(--sub) }
.card svg { display: block; width: 100%; height: auto }
.card text { font-family: var(--font); fill: var(--sub); font-size: 10px }
.card .v { fill: var(--fg); font-weight: 700; font-size: 11px }
.card .gl { font-weight: 700 }
.foot { font-size: 10px; color: var(--sub); text-align: right; margin-top: 4px }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<div class="foot" id="foot"></div>
<script>
const q = new URLSearchParams(location.search);
const num = k => (q.get(k) === null || q.get(k) === "" || isNaN(+q.get(k))) ? null : +q.get(k);
const clamp = p => Math.min(100, Math.max(0, p));
const now = new Date();

// 履歴を読む: "9/10:74.9,9/11:75.5" → [{dt, val, label}]
const series = key => (q.get(key) || "").split(",").map(t => {
  const [md, v] = t.split(":"), [m, d] = (md || "").split("/").map(Number), val = +v;
  if (!m || !d || isNaN(val)) return null;
  let dt = new Date(now.getFullYear(), m - 1, d);
  if (dt > now) dt = new Date(now.getFullYear() - 1, m - 1, d);
  return { dt, val, label: `${m}/${d}` };
}).filter(Boolean).sort((a, b) => a.dt - b.dt);

const w = num("w"), s = num("s"), g = num("g"), ht = num("ht") || 168.5;
const bmi = kg => kg / ((ht / 100) ** 2);
const W = series("h");

// 折れ線のカード。decimals=小数の桁数、ref=目標の線(点線)、good="down"なら減るほど良い
function card({ title, pts, color, unit, dec, ref, refLabel, good }) {
  if (pts.length < 2) return "";
  const first = pts[0], last = pts[pts.length - 1], diff = last.val - first.val;
  const better = good === "down" ? diff < 0 : good === "up" ? diff > 0 : null;
  const dtxt = `${diff > 0 ? "+" : ""}${diff.toFixed(dec)}${unit}`;
  const Wd = 520, H = 150, L = 36, R = 16, T = 16, B = 22;
  const vals = pts.map(p => p.val).concat(ref != null ? [ref] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max((hi - lo) * 0.12, dec ? 0.2 : 0.5); lo -= pad; hi += pad;
  const t0 = first.dt.getTime(), t1 = last.dt.getTime() || 1;
  const X = dt => L + (t1 === t0 ? 0.5 : (dt.getTime() - t0) / (t1 - t0)) * (Wd - L - R);
  const Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const fmt = v => v.toFixed(dec);
  let svg = `<svg viewBox="0 0 ${Wd} ${H}">`;
  for (let i = 0; i <= 3; i++) { const v = lo + (hi - lo) * i / 3; svg += `<line x1="${L}" x2="${Wd - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="rgba(20,40,60,.09)"/><text x="${L - 5}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`; }
  if (ref != null) svg += `<line x1="${L}" x2="${Wd - R}" y1="${Y(ref).toFixed(1)}" y2="${Y(ref).toFixed(1)}" stroke="#0a9e72" stroke-width="1.5" stroke-dasharray="5 4"/><text class="gl" fill="#0a9e72" style="fill:#0a9e72" x="${Wd - R}" y="${(Y(ref) - 4).toFixed(1)}" text-anchor="end">${refLabel}</text>`;
  svg += `<path d="${pts.map((p, i) => `${i ? "L" : "M"}${X(p.dt).toFixed(1)},${Y(p.val).toFixed(1)}`).join(" ")}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p, i) => { const l = i === pts.length - 1; svg += `<circle cx="${X(p.dt).toFixed(1)}" cy="${Y(p.val).toFixed(1)}" r="${l ? 5 : 2.6}" fill="${l ? "#ff9f0a" : color}" stroke="#fff" stroke-width="1.4"/>`; });
  svg += `<text class="v" x="${X(last.dt).toFixed(1)}" y="${(Y(last.val) - 9).toFixed(1)}" text-anchor="end">${fmt(last.val)}</text>`;
  const step = Math.max(1, Math.ceil(pts.length / 7));
  pts.forEach((p, i) => { if (i % step === 0) svg += `<text x="${X(p.dt).toFixed(1)}" y="${H - 6}" text-anchor="middle">${p.label}</text>`; });
  return `<div class="card" style="--c:${color}"><div class="hd"><b>${title}</b><span class="big">${fmt(last.val)}${unit}</span><small>${first.label} から ${dtxt}${better === null ? "" : better ? " ↗ いい方向" : " ↘ 逆方向"}</small></div>${svg}</svg></div>`;
}

const html = [`<div class="cap">体のステータス</div>`];
if (w !== null && s !== null && g !== null) {
  const p = clamp((s - w) / (s - g) * 100), diff = w - g;
  html.push(`<div class="row"><div class="n">体重<small>${w}kg → 目標${g}kg</small></div><div class="bar"><i style="width:${p}%;--c:#6fd3b0"></i></div><div class="pct">${p.toFixed(0)}%</div><div class="left">${diff > 0 ? `あと ${diff.toFixed(1)}kg` : "目標達成!"}</div></div>`);
}
html.push(card({ title: "体重", pts: W, color: "#2bb88a", unit: "kg", dec: 1, ref: g, refLabel: g != null ? `目標 ${g}kg` : "", good: "down" }));
html.push(card({ title: "BMI", pts: W.map(p => ({ ...p, val: bmi(p.val) })), color: "#3b82f6", unit: "", dec: 1, ref: g != null ? bmi(g) : null, refLabel: g != null ? `目標 ${bmi(g).toFixed(1)}` : "", good: "down" }));
html.push(card({ title: "体脂肪率", pts: series("f"), color: "#f97316", unit: "%", dec: 1, good: "down" }));
html.push(card({ title: "筋肉量", pts: series("m"), color: "#a855f7", unit: "kg", dec: 1, good: "up" }));
document.getElementById("wrap").innerHTML = html.join("");
document.getElementById("foot").textContent = q.get("d") ? `${q.get("d")} の測定` : "";
</script>
</body>
</html>
