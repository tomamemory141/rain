<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ステータス</title>
<style>
/* 体重が目標までどれだけ進んだかを棒で、体重・BMI・体脂肪率・筋肉量の履歴を、1つの表に重ねた折れ線で出す。
   数字はアドレスで渡す: w=今の体重 s=はじめの体重 g=目標 ht=身長(cm) d=測定日
   h=体重の履歴 / f=体脂肪率の履歴 / m=筋肉量の履歴(どれも 9/10:74.9,9/11:75.5 … の形)。BMIは体重と身長から計算する */
:root { --fg: #1b2733; --sub: #5d6b79; --font: -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif; color-scheme: light }
* { box-sizing: border-box }
html, body { margin: 0 }
body { background: #fff; color: var(--fg); font-family: var(--font); padding: 6px 12px; min-height: 100vh }
.wrap { max-width: 560px; display: grid; gap: 8px; background: #f3f6fa; border-radius: 16px; padding: 8px 14px 10px }
.cap { font-size: 12px; color: var(--sub); padding-bottom: 4px; border-bottom: 1px solid rgba(20,40,60,.14) }
.row { display: grid; grid-template-columns: 112px 1fr 56px 112px; align-items: center; gap: 8px }
.row .n { font-size: 15px; font-weight: 700; white-space: nowrap }
.row .n small { display: block; font-size: 11px; font-weight: 400; color: var(--sub) }
.row .pct { font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700 }
.bar { position: relative; height: 12px; border-radius: 7px; background: rgba(20,40,60,.09); overflow: hidden }
.bar i { display: block; height: 100%; border-radius: 7px; background: var(--c); min-width: 3px }
.left { font-size: 12px; color: var(--sub); white-space: nowrap }
.stack { background: #fff; border-radius: 12px; padding: 4px 6px 2px }
.stack svg { display: block; width: 100%; height: auto }
.stack text { font-family: var(--font); fill: var(--sub); font-size: 10px }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; padding: 2px 6px 8px }
.lg { display: grid; grid-template-columns: 10px auto 1fr; grid-template-rows: auto auto; align-items: center; gap: 0 6px; font-size: 12px }
.lg i { width: 10px; height: 10px; border-radius: 50% }
.lg .big { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right }
.lg small { grid-column: 2 / -1; font-size: 10px; color: var(--sub); line-height: 1.3 }
.foot { font-size: 10px; color: var(--sub); text-align: right; margin-top: 4px }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<div class="foot" id="foot"></div>
<script>
const q = new URLSearchParams(location.search);
const num = k => (q.get(k) === null || q.get(k) === "" || isNaN(+q.get(k))) ? null : +q.get(k);
const clamp = p => Math.min(100, Math.max(0, p));
const now = new Date();

// 履歴を読む: "9/10:74.9,9/11:75.5" → [{dt, val, label}]
const series = key => (q.get(key) || "").split(",").map(t => {
  const [md, v] = t.split(":"), [m, d] = (md || "").split("/").map(Number), val = +v;
  if (!m || !d || isNaN(val)) return null;
  let dt = new Date(now.getFullYear(), m - 1, d);
  if (dt > now) dt = new Date(now.getFullYear() - 1, m - 1, d);
  return { dt, val, label: `${m}/${d}` };
}).filter(Boolean).sort((a, b) => a.dt - b.dt);

const w = num("w"), s = num("s"), g = num("g"), ht = num("ht") || 168.5;
const bmi = kg => kg / ((ht / 100) ** 2);
const W = series("h");

// 4つの線を、1つの表に重ねる(単位がちがうので、それぞれの最小〜最大を同じ高さにそろえて、形を比べる)
function overlay(lines) {
  lines = lines.filter(p => p.pts.length >= 2);
  if (!lines.length) return "";
  const all = lines.flatMap(p => p.pts.map(x => x.dt.getTime()));
  const t0 = Math.min(...all), t1 = Math.max(...all);
  const Wd = 520, H = 250, L = 30, R = 14, T = 12, B = 24;
  const X = t => L + (t1 === t0 ? 0.5 : (t - t0) / (t1 - t0)) * (Wd - L - R);
  const Y = n => T + (1 - n) * (H - T - B);
  let svg = `<svg viewBox="0 0 ${Wd} ${H}">`;
  const DAY = 86400000;
  for (let t = t0; t <= t1 + 1; t += 7 * DAY) { const d = new Date(t); svg += `<line x1="${X(t).toFixed(1)}" x2="${X(t).toFixed(1)}" y1="${T}" y2="${H - B}" stroke="rgba(20,40,60,.08)"/><text x="${X(t).toFixed(1)}" y="${H - 8}" text-anchor="middle">${d.getMonth() + 1}/${d.getDate()}</text>`; }
  [0, .5, 1].forEach(n => { svg += `<line x1="${L}" x2="${Wd - R}" y1="${Y(n)}" y2="${Y(n)}" stroke="rgba(20,40,60,.1)"/>`; });
  svg += `<text x="${L - 4}" y="${Y(1) + 3}" text-anchor="end">高い</text><text x="${L - 4}" y="${Y(0) + 3}" text-anchor="end">低い</text>`;
  lines.forEach(p => {
    const vals = p.pts.map(x => x.val), lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
    p.lo = lo; p.hi = hi;
    const N = v => (v - lo) / span;
    svg += `<path d="${p.pts.map((x, i) => `${i ? "L" : "M"}${X(x.dt.getTime()).toFixed(1)},${Y(N(x.val)).toFixed(1)}`).join(" ")}" fill="none" stroke="${p.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" opacity=".92"/>`;
    const l = p.pts[p.pts.length - 1];
    svg += `<circle cx="${X(l.dt.getTime()).toFixed(1)}" cy="${Y(N(l.val)).toFixed(1)}" r="4.5" fill="${p.color}" stroke="#fff" stroke-width="1.6"/>`;
  });
  svg += `</svg>`;
  const legend = lines.map(p => {
    const first = p.pts[0], last = p.pts[p.pts.length - 1], diff = last.val - first.val, f = v => v.toFixed(p.dec);
    return `<div class="lg"><i style="background:${p.color}"></i><b>${p.title}</b><span class="big" style="color:${p.color}">${f(last.val)}${p.unit}</span><small>${first.label}から ${diff > 0 ? "+" : ""}${diff.toFixed(p.dec)}${p.unit}<br>幅 ${f(p.lo)}〜${f(p.hi)}</small></div>`;
  }).join("");
  return `<div class="stack">${svg}<div class="legend">${legend}</div></div>`;
}

const html = [`<div class="cap">体のステータス</div>`];
if (w !== null && s !== null && g !== null) {
  const p = clamp((s - w) / (s - g) * 100), diff = w - g;
  html.push(`<div class="row"><div class="n">体重<small>${w}kg → 目標${g}kg</small></div><div class="bar"><i style="width:${p}%;--c:#6fd3b0"></i></div><div class="pct">${p.toFixed(0)}%</div><div class="left">${diff > 0 ? `あと ${diff.toFixed(1)}kg` : "目標達成!"}</div></div>`);
}
html.push(overlay([
  { title: "体重", pts: W, color: "#2bb88a", unit: "kg", dec: 1, ref: g, refLabel: g != null ? `目標 ${g}kg` : "", good: "down" },
  { title: "BMI", pts: W.map(p => ({ ...p, val: bmi(p.val) })), color: "#3b82f6", unit: "", dec: 1, ref: g != null ? bmi(g) : null, refLabel: g != null ? `目標 ${bmi(g).toFixed(1)}` : "", good: "down" },
  { title: "体脂肪率", pts: series("f"), color: "#f97316", unit: "%", dec: 1, good: "down" },
  { title: "筋肉量", pts: series("m"), color: "#a855f7", unit: "kg", dec: 1, good: "up" }
]));
document.getElementById("wrap").innerHTML = html.join("");
document.getElementById("foot").textContent = q.get("d") ? `${q.get("d")} の測定` : "";
</script>
</body>
</html>
